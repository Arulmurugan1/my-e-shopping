# Same shape as inventory-service.yaml, which explains each field.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: { app: auth-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: eshop/auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef: { name: platform }
            - secretRef: { name: credentials }
          env:
            # auth-service is the one service on Oracle.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:oracle:thin:@$(ORACLE_HOST):1521:XE
            - name: SPRING_DATASOURCE_USERNAME
              value: $(ORACLE_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(ORACLE_PASSWORD)
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports:
    - name: http
      port: 8081
      targetPort: http
