server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
      # Each uri can be overridden with an env var, e.g. ORDER_SERVICE_BASE_URL=http://order-service:8084
      # in Kubernetes; the localhost defaults are for running everything on one machine.
      routes:
        # Service-to-service endpoints; never exposed through the gateway
        - id: auth-internal-blocked
          uri: no://op
          predicates: [Path=/api/v1/auth/internal/**]
          filters: [SetStatus=404]
        - id: auth-service
          uri: ${auth-service.base-url:http://localhost:8081}
          predicates: [Path=/api/v1/auth/**]
        - id: inventory-service
          uri: ${inventory-service.base-url:http://localhost:8082}
          predicates: ["Path=/api/v1/products/**,/api/v1/inventory/**"]
        - id: cart-service
          uri: ${cart-service.base-url:http://localhost:8083}
          predicates: [Path=/api/v1/cart/**]
        - id: order-service
          uri: ${order-service.base-url:http://localhost:8084}
          predicates: [Path=/api/v1/orders/**]
        - id: payment-service
          uri: ${payment-service.base-url:http://localhost:8085}
          predicates: [Path=/api/v1/payments/**]
        - id: picking-service
          uri: ${picking-service.base-url:http://localhost:8086}
          predicates: [Path=/api/v1/picking/**]
        - id: shipment-service
          uri: ${shipment-service.base-url:http://localhost:8087}
          predicates: [Path=/api/v1/shipments/**]
        - id: delivery-service
          uri: ${delivery-service.base-url:http://localhost:8088}
          predicates: [Path=/api/v1/deliveries/**]
        - id: invoice-service
          uri: ${invoice-service.base-url:http://localhost:8089}
          predicates: [Path=/api/v1/invoices/**]
        - id: return-refund-service
          uri: ${return-refund-service.base-url:http://localhost:8090}
          predicates: [Path=/api/v1/returns/**]
        - id: customer-service
          uri: ${customer-service.base-url:http://localhost:8091}
          predicates: [Path=/api/v1/customers/**]
        - id: cartonization-service
          uri: ${cartonization-service.base-url:http://localhost:8092}
          predicates: [Path=/api/v1/cartonization/**]
        - id: order-group-service
          uri: ${order-group-service.base-url:http://localhost:8093}
          predicates: [Path=/api/v1/order-groups/**]
        - id: notification-service
          uri: ${notification-service.base-url:http://localhost:8094}
          predicates: [Path=/api/v1/notifications/**]
        - id: logging-service
          uri: ${logging-service.base-url:http://localhost:8095}
          predicates: [Path=/api/v1/logs/**]
        - id: audit-service
          uri: ${audit-service.base-url:http://localhost:8096}
          predicates: [Path=/api/v1/audit/**]
        - id: scheduler-service
          uri: ${scheduler-service.base-url:http://localhost:8097}
          predicates: [Path=/api/v1/jobs/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
