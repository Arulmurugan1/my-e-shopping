<div class="popup-overlay" *ngIf="visible" (click)="close()">
    <div class="popup-card" [class.success]="success" [class.failure]="!success" (click)="$event.stopPropagation()">
        <h3>{{ title }}</h3>
        <p>{{ message }}</p>
        <button (click)="close()">OK</button>
    </div>
</div>
