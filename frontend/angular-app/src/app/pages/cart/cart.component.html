<app-nav></app-nav>
<main class="page">
    <div class="section-heading">
        <div><span class="eyebrow">CART</span>
            <h2>Your cart</h2>
        </div>
    </div>
    <p class="status" *ngIf="status">{{ status }}</p>
    <table class="data-table" *ngIf="cart?.items?.length">
        <thead>
            <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of cart!.items">
                <td>{{ item.productName }}</td>
                <td>{{ item.quantity }}</td>
                <td>${{ item.unitPrice | number:'1.2-2' }}</td>
                <td><button class="remove" (click)="removeItem(item.productId)">Remove</button></td>
            </tr>
        </tbody>
    </table>
    <p class="empty" *ngIf="!cart?.items?.length">Your cart is empty.</p>
    <div class="cart-total" *ngIf="cart?.items?.length">
        <strong>Total: ${{ cart!.totalAmount | number:'1.2-2' }}</strong>
        <button (click)="placeOrder()" [disabled]="placing">{{ placing ? 'Placing order...' : 'Place order' }}</button>
    </div>
</main>
<app-popup [visible]="popupVisible" [success]="popupSuccess" [title]="popupTitle" [message]="popupMessage"
    (closed)="closePopup()"></app-popup>
