services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myeshopping
      POSTGRES_PASSWORD: myeshopping
      POSTGRES_DB: myeshopping
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myeshopping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eshop-platform]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eshop-platform]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    networks: [eshop-platform]
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [eshop-platform]
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: myeshopping
      MONGO_INITDB_ROOT_PASSWORD: myeshopping
    ports: ["27017:27017"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eshop-platform]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: myeshopping
      MYSQL_USER: myeshopping
      MYSQL_PASSWORD: myeshopping
      MYSQL_DATABASE: myeshopping
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eshop-platform]
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    environment:
      ORACLE_PASSWORD: myeshopping123
      ORACLE_ALLOW_REMOTE: true
    ports: ["1521:1521"]
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/myeshopping123@//localhost:1521/XE", "as", "sysdba", "SELECT 1 FROM dual"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [eshop-platform]
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [eshop-platform]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [eshop-platform]
volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  mysql-data:
  oracle-data:
networks:
  eshop-platform:
